<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Piston Hub</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #000;
        color: #fff;
      }
      nav {
        background-color: #000;
        font-family: "Brygada 1918", serif;
        font-style: italic;
        padding: 30px;
        display: flex;
        align-items: center;
      }
      .logo img {
        height: 40px;
        width: 60px;
      }
      nav ul {
        list-style-type: none;
        text-align: center;
        margin-left: auto;
      }
      nav ul li {
        display: inline;
        margin-right: 20px;
      }
      nav ul li a {
        color: white;
        text-decoration: none;
      }
      h1 {
        font-family: "Italianno", cursive;
        font-size: 64px;
        text-align: center;
        margin: 40px 0 10px;
      }
      .auth-container {
        max-width: 420px;
        margin: 0 auto 60px;
        background-color: #111;
        padding: 25px 20px 30px;
        border-radius: 10px;
      }
      label {
        display: block;
        margin-top: 10px;
        margin-bottom: 4px;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 4px;
        border: 1px solid #444;
        background-color: #000;
        color: #fff;
        box-sizing: border-box;
      }
      .primary-btn {
        width: 100%;
        margin-top: 18px;
        padding: 10px 16px;
        background-color: orange;
        color: #000;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }
      .primary-btn:hover {
        background-color: #ffc04d;
      }
      .helper {
        margin-top: 12px;
        font-size: 13px;
        text-align: center;
      }
      .helper a {
        color: orange;
        text-decoration: none;
      }
      .error {
        display: none;
        margin-top: 10px;
        padding: 8px;
        border-radius: 4px;
        background-color: #4f1f1f;
        color: #f6bdbd;
        font-size: 13px;
      }
      .success {
        display: none;
        margin-top: 10px;
        padding: 8px;
        border-radius: 4px;
        background-color: #1f4f2f;
        color: #bdf6c8;
        font-size: 13px;
      }
    </style>
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body>
    <nav>
      <div class="logo">
        <a href="index.html"
          ><img
            src="all images/piston hub white.png"
            alt="Piston Hub logo"
        /></a>
      </div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="slider.html">Shop</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="contact us page.html">Contact</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a id="navUserLink" href="login.html"><span id="navUserName">Login</span></a></li>
      </ul>
    </nav>

    <h1>Create account</h1>
    <div class="auth-container">
      <form id="signupForm">
        <label for="name">Name</label>
        <input id="name" name="name" required />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />

        <label for="confirmPassword">Confirm password</label>
        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <button class="primary-btn" type="submit">Sign up</button>
        <div id="errorBox" class="error"></div>
        <div id="successBox" class="success"></div>
      </form>
      <div class="helper">
        Already have an account?
        <a href="login.html">Login here</a>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('signupForm');
        const errorBox = document.getElementById('errorBox');
        const successBox = document.getElementById('successBox');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          errorBox.style.display = 'none';
          successBox.style.display = 'none';

          const name = document.getElementById('name').value.trim();
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
          const confirmPassword =
            document.getElementById('confirmPassword').value;

          if (password.length < 8) {
            errorBox.textContent = 'Password must be at least 8 characters';
            errorBox.style.display = 'block';
            return;
          }
          if (password !== confirmPassword) {
            errorBox.textContent = 'Passwords do not match';
            errorBox.style.display = 'block';
            return;
          }

          const result = await signupUser({ name, email, password });
          if (!result.ok) {
            errorBox.textContent = result.message || 'Unable to sign up';
            errorBox.style.display = 'block';
            return;
          }
          successBox.textContent = 'Account created! Redirecting...';
          successBox.style.display = 'block';
          await updateAuthUI();
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1000);
        });
      });
    </script>
  </body>
</html>
