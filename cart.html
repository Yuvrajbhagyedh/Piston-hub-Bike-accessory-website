    <h1>Your Cart</h1>
    <div class="cart-container">
      <div id="cartEmpty" class="empty-message" style="display: none">
        Your cart is empty. Start shopping from the <a href="slider.html" style="color: orange;">Shop page</a>.
      </div>
      <table id="cartTable" style="display: none">
        <thead>
          <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Subtotal</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="cartBody"></tbody>
      </table>
      <div class="cart-summary" id="cartSummary" style="display: none">
        <p><strong>Total items:</strong> <span id="summaryItems">0</span></p>
        <p><strong>Total amount:</strong> ₹<span id="summaryTotal">0</span></p>
        <button
          class="checkout-btn"
          onclick="window.location.href='checkout.html'"
        >
          Proceed to Payment
        </button>
      </div>
    </div>

    <script src="script.js"></script>
    <script src="analytics.js"></script>
    <script>
      function renderCart() {
        const cart = getCart();
        const body = document.getElementById('cartBody');
        const table = document.getElementById('cartTable');
        const empty = document.getElementById('cartEmpty');
        const summary = document.getElementById('cartSummary');
        const itemsEl = document.getElementById('summaryItems');
        const totalEl = document.getElementById('summaryTotal');

        body.innerHTML = '';

        if (!cart.length) {
          table.style.display = 'none';
          summary.style.display = 'none';
          empty.style.display = 'block';
          updateNavCartCount();
          return;
        }

        empty.style.display = 'none';
        table.style.display = 'table';
        summary.style.display = 'block';

        let totalItems = 0;
        let totalAmount = 0;

        cart.forEach((item) => {
          const tr = document.createElement('tr');

          const tdItem = document.createElement('td');
          const img = document.createElement('img');
          img.className = 'cart-image';
          if (item.image) img.src = item.image;
          img.alt = item.name;
          const nameSpan = document.createElement('span');
          nameSpan.textContent = ' ' + item.name;
          tdItem.appendChild(img);
          tdItem.appendChild(nameSpan);

          const tdPrice = document.createElement('td');
          tdPrice.textContent = '₹' + (item.price || 0);

          const tdQty = document.createElement('td');
          const qtyInput = document.createElement('input');
          qtyInput.type = 'number';
          qtyInput.min = '1';
          qtyInput.value = item.quantity;
          qtyInput.className = 'qty-input';
          qtyInput.addEventListener('change', () => {
            const val = parseInt(qtyInput.value, 10) || 1;
            updateCartQuantity(item.id, val);
            renderCart();
          });
          tdQty.appendChild(qtyInput);

          const tdSubtotal = document.createElement('td');
          const subtotal = (item.price || 0) * (item.quantity || 0);
          tdSubtotal.textContent = '₹' + subtotal.toFixed(2);

          const tdRemove = document.createElement('td');
          const removeBtn = document.createElement('button');
          removeBtn.textContent = 'Remove';
          removeBtn.className = 'remove-btn';
          removeBtn.addEventListener('click', () => {
            removeFromCart(item.id);
            renderCart();
          });
          tdRemove.appendChild(removeBtn);

          tr.appendChild(tdItem);
          tr.appendChild(tdPrice);
          tr.appendChild(tdQty);
          tr.appendChild(tdSubtotal);
          tr.appendChild(tdRemove);

          body.appendChild(tr);

          totalItems += item.quantity || 0;
          totalAmount += subtotal;
        });

        itemsEl.textContent = totalItems;
        totalEl.textContent = totalAmount.toFixed(2);
        updateNavCartCount();
      }

      document.addEventListener('DOMContentLoaded', renderCart);
    </script>
