services:
  - type: web
    name: piston-hub
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@pistonhub.com
      - key: ADMIN_PASSWORD
        sync: false # set this in the Render dashboard
